<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #fafafa;
        }

        .container {
            width: 350px;
        }

        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 40px 40px 25px;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: -1px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            background: #fafafa;
            font-size: 12px;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 7px;
            background: #3897f0;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .or {
            margin: 22px 0;
            color: #737373;
            font-size: 13px;
        }

        .forgot {
            color: #00376b;
            font-size: 12px;
            margin-top: 18px;
            cursor: pointer;
        }

        .signup {
            margin-top: 10px;
            background: white;
            border: 1px solid #dbdbdb;
            padding: 22px;
            text-align: center;
            font-size: 14px;
        }

        .signup span {
            color: #0095f6;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            color: #737373;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">SocialConnect</div>

            <form>
                <input type="text" placeholder="Phone number, username, or email">

                <input type="password" placeholder="Password">

                <button type="submit">Log in</button>
            </form>

            <div class="or">──────── OR ────────</div>

            <div class="forgot">Forgot password?</div>

        </div>

        <div class="signup">
            Don't have an account? <span>Sign up</span>
        </div>

        <div class="footer">
            College Project • SocialConnect
        </div>

    </div>

</body>
</html>
