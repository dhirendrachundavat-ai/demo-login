```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 350px;
        }

        .login-box {
            background: white;
            border: 1px solid #e0e3e8;
            border-radius: 12px;
            padding: 32px 40px 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        /* Original SocialConnect Logo */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #3157d5, #6845e8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: -2px;
            box-shadow: 0 6px 15px rgba(72, 74, 200, 0.25);
        }

        .logo-name {
            margin-top: 11px;
            font-size: 28px;
            font-weight: 700;
            color: #202124;
            letter-spacing: -1px;
        }

        .tagline {
            margin-top: 5px;
            color: #777;
            font-size: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #d9dce1;
            border-radius: 6px;
            background: #fafafa;
            font-size: 12px;
            outline: none;
        }

        input:focus {
            border-color: #5967e8;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: #4f5fe7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3e4fd0;
        }

        .or {
            margin: 22px 0;
            color: #888;
            font-size: 12px;
        }

        .forgot {
            color: #4f5fe7;
            font-size: 12px;
            margin-top: 18px;
            cursor: pointer;
        }

        .signup {
            margin-top: 12px;
            background: white;
            border: 1px solid #e0e3e8;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }

        .signup span {
            color: #4f5fe7;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">

                <div class="logo-icon">
                    SC
                </div>

                <div class="logo-name">
                    SocialConnect
                </div>

                <div class="tagline">
                    Connect • Share • Discover
                </div>

            </div>

            <form>
                <input
                    type="text"
                    placeholder="Username or email"
                >

                <input
                    type="password"
                    placeholder="Password"
                >

                <button type="submit">
                    Log in
                </button>
            </form>

            <div class="or">
                ──────── OR ────────
            </div>

            <div class="forgot">
                Forgot password?
            </div>

        </div>

        <div class="signup">
            Don't have an account?
            <span>Sign up</span>
        </div>

        <div class="footer">
            College Project • SocialConnect
        </div>

    </div>

</body>
</html>
